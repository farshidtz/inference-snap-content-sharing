name: consumer # you probably want to 'snapcraft register <name>'
base: core26 # the base snap is the execution environment for this snap
version: '0.1' # just for humans, typically '1.2+git' or '1.3.2'
summary: Single-line elevator pitch for your amazing snap # 79 char long summary
description: |
  This is my-snap's description. You have a paragraph or two to tell the
  most important story about your snap. Keep it under 100 words though,
  we live in tweetspace and your description wants to look good in the snap
  store.

grade: devel
confinement: strict

plugs:
  # receive config from inference snaps
  provider:
    interface: content
    # Open questions:
    # - Should this be versioned? The API itself is versioned. The env file is too simple and can easily remain compatible across versions.
    # - Should this be made specific to openai? No, the consumer can look it up and react accordingly.
    content: provider
    target: $SNAP/share # Provider should use a unique name to avoid conflicts that trigger numbered directories
  model-weights:
    interface: content
    # content: 
    target: $SNAP/share # Provider should use a unique name to avoid conflicts that trigger numbered directories

parts:
  myapp:
    plugin: dump
    source: .

apps:
  consumer:
    command: app.sh
