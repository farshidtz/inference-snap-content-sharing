name: gemma3-jane # you probably want to 'snapcraft register <name>'
base: core26 # the base snap is the execution environment for this snap
version: '0.1' # just for humans, typically '1.2+git' or '1.3.2'
summary: Single-line elevator pitch for your amazing snap # 79 char long summary
description: |
  This is my-snap's description. You have a paragraph or two to tell the
  most important story about your snap. Keep it under 100 words though,
  we live in tweetspace and your description wants to look good in the snap
  store.

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: devmode # use 'strict' once you have the right plugs and slots

slots:
  # To share status with other snaps
  status:
    interface: content
    content: status
    source:
      read:
        # Give it a unique name to identify the source and avoid conflicts that trigger numbered directories
        - $SNAP_COMMON/share/status/$SNAP_INSTANCE_NAME
 # To share model weights
 # models:
 # can we set components as sources?

plugs:
  # To receive defaults from other snaps
  defaults:
    interface: content
    content: defaults
    target: $SNAP_COMMON/share # Provider uses "defaults" as dir name.

parts:
  myapp:
    plugin: dump
    source: .
    stage-packages:
      - jq


apps:
  gemma:
    command: app.sh

components:
  test:
    type: standard
    summary: Test component
    description: Test component
